<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set your password · QHT Influencer Manager</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; background: linear-gradient(160deg, #0f766e, #0f172a); }
    .sheet { width: 100%; max-width: 420px; padding: 1rem; }
    .step-line { display: flex; gap: .4rem; align-items: center; margin-bottom: 1rem; font-size: .74rem; }
    .step { flex: 1; height: 4px; border-radius: 999px; background: var(--line); }
    .step.done { background: var(--green); }
    .step.now { background: var(--teal); }
    .rules { list-style: none; padding: 0; margin: .5rem 0 0; font-size: .78rem; }
    .rules li { display: flex; gap: .45rem; align-items: center; color: var(--muted); padding: .12rem 0; }
    .rules li.ok { color: var(--green); }
    .rules li .tick { width: 1rem; text-align: center; }
  </style>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#93c2b8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QHT">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
</head>
<body>
  <div class="sheet">
    <div class="card">
      <div class="step-line">
        <span class="step done" title="Agreement accepted"></span>
        <span class="step now" title="Set your password"></span>
      </div>

      <h1 style="margin-bottom:.2rem">Set your own password</h1>
      <p class="small muted">
        The password you were given is <b>temporary</b>. Choose your own to finish setting up
        <span id="whoLine"></span>.
      </p>

      <div id="msg"></div>

      <form id="pwForm" novalidate>
        <div class="field">
          <label for="cur">Temporary password</label>
          <input id="cur" type="password" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label for="nw">New password</label>
          <input id="nw" type="password" autocomplete="new-password" required>
          <ul class="rules" id="pwRules"></ul>
        </div>
        <div class="field">
          <label for="nw2">Confirm new password</label>
          <input id="nw2" type="password" autocomplete="new-password" required>
          <ul class="rules" id="matchRule"></ul>
        </div>

        <button class="btn block" id="saveBtn" type="submit" disabled>Save password &amp; continue</button>
      </form>

      <p class="tiny muted center" style="margin:.8rem 0 0">
        You cannot reach your dashboard until this is done.
        <button class="link" id="signOut">Sign out</button>
      </p>
    </div>
  </div>

  <script type="module">
    import { api, auth, $, toast, homeFor, enablePasswordToggle, goTo,
             renderPasswordRules } from '/js/api.js';

    const me = await api('/auth/me').catch(() => null);
    if (!me) await goTo('/');

    // the agreement comes first; and if the password is already set, move on
    if (me.needsAgreement) await goTo('/agreement.html');
    if (!me.mustChangePassword) await goTo(homeFor(me.user.role));

    $('#whoLine').textContent = me.user.full_name;
    ['#cur', '#nw', '#nw2'].forEach(s => enablePasswordToggle($(s)));
    $('#signOut').onclick = () => auth.logout();

    const check = () => {
      const cur = $('#cur').value, nw = $('#nw').value, nw2 = $('#nw2').value;

      // strength rules + "not the temporary one", for the new-password box
      const strongAndNew = renderPasswordRules($('#pwRules'), nw, [
        { key: 'diff', label: 'Different from the temporary one',
          test: v => v.length > 0 && v !== cur }
      ]);

      // the confirm box only has one rule of its own
      const matches = nw2.length > 0 && nw === nw2;
      $('#matchRule').innerHTML =
        `<li class="${matches ? 'ok' : ''}"><span class="tick">${matches ? '✓' : '○'}</span>Both entries match</li>`;

      $('#saveBtn').disabled = !(cur && strongAndNew && matches);
    };

    ['#cur', '#nw', '#nw2'].forEach(s => $(s).oninput = check);
    check();

    $('#pwForm').onsubmit = async e => {
      e.preventDefault();
      const btn = $('#saveBtn');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        await api('/auth/change-password', {
          method: 'POST',
          body: { currentPassword: $('#cur').value, newPassword: $('#nw').value }
        });
        await goTo(homeFor(me.user.role));
      } catch (err) {
        toast($('#msg'), err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Save password & continue';
      }
    };
  </script>
  <script type="module">import { mountInstallButton } from '/js/pwa.js'; mountInstallButton();</script>
</body>
</html>
